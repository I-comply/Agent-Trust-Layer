name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python }}" }
      - name: Pull pinned sandbox image (enables Docker executor tests)
        run: docker pull "$(python3 -c 'from atl.executor import DEFAULT_IMAGE as i; print(i)')"
      - run: pip install py_ecc
      - run: ./verify.sh
      - run: python3 -m harness.run_agents --tenants 2 --agents 4 --out /tmp/harness
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install bandit
      - run: bandit -r atl -ll
  sbom:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: atl-sbom.cdx.json
          artifact-name: atl-sbom.cdx.json
      - run: docker build -t atl-gateway .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: atl-gateway
          format: cyclonedx-json
          output-file: atl-image-sbom.cdx.json
          artifact-name: atl-image-sbom.cdx.json
